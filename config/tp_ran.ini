include omnetpp.ini

[Config TP-RAN-DL]
network = simu5g.simulations.NR.networks.SingleCell_Standalone
sim-time-limit = 20s

*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m

*.numUe = 5
*.ue[*].macCellId = 0
*.ue[*].masterId = 0
*.ue[*].nrMacCellId = 1
*.ue[*].nrMasterId = 1

*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.initialX = uniform(300m,600m)
*.ue[*].mobility.initialY = uniform(200m,400m)
*.ue[*].mobility.speed = uniform(1mps,5mps)

*.ue[*].numApps = 1
*.server.numApps = 5

*.ue[*].app[*].typename = "CbrReceiver"
*.ue[*].app[*].localPort = 3000

*.server.app[*].typename = "CbrSender"
*.server.app[*].packetSize = 1000B
*.server.app[*].sampling_time = 0.01s
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].startTime = uniform(0s,0.02s)
